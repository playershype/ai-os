name: Apply audited Spanish update

on:
  push:
    branches:
      - spanish-branding-v1.2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-branding-v1.2
          fetch-depth: 0
      - name: Apply exact audited files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .payload/large3.tgz
          rm -rf .payload
          rm -f .github/workflows/apply-spanish-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply audited Spanish branding update"
          git push origin HEAD:spanish-branding-v1.2
